<!DOCTYPE html>
<html lang="az" suppressHydrationWarning>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#fbf1f3">
    <title>Chinara Mammadova | Tezliklə</title>
    
    <!-- İkonlar (Yeni reponun /public və ya əsas qovluğuna icon.svg yükləsəniz avtomatik işləyəcək) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CM Lab Dark Mode Skripti -->
    <script>
        try {
            var t = localStorage.getItem("psystat_theme");
            var d = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
    </script>

    <style>
        /* CM Lab Şriftləri */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@300;400;500&display=swap');
        
        /* CM Lab Shadcn Light Mode Rəngləri */
        :root {
            --background: oklch(0.982 0.012 8);
            --foreground: oklch(0.25 0.03 10);
            --card: oklch(0.995 0.005 8);
            --card-foreground: oklch(0.25 0.03 10);
            --primary: oklch(0.57 0.13 5);
            --muted-foreground: oklch(0.5 0.035 10);
            --border: oklch(0.915 0.03 8);
        }
        
        /* CM Lab Shadcn Dark Mode Rəngləri */
        html.dark {
            --background: oklch(0.145 0 0);
            --foreground: oklch(0.985 0 0);
            --card: oklch(0.205 0 0);
            --card-foreground: oklch(0.985 0 0);
            --primary: oklch(0.922 0 0);
            --muted-foreground: oklch(0.708 0 0);
            --border: oklch(1 0 0 / 10%);
        }

        body { 
            font-family: 'Noto Sans', ui-sans-serif, system-ui, sans-serif; 
            background-color: var(--background);
            color: var(--foreground);
        }
        
        h1, h2 {
            font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
        }

        .custom-card {
            background-color: var(--card);
            color: var(--card-foreground);
            border: 1px solid var(--border);
        }

        .custom-primary-text { color: var(--primary); }
        .custom-primary-bg { background-color: var(--primary); }
        .custom-primary-bg-light { background-color: color-mix(in oklch, var(--primary) 15%, transparent); }
        .custom-muted-text { color: var(--muted-foreground); }

        .fade-in { animation: fadeIn 1s ease-in-out; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4 antialiased transition-colors duration-300">

    <div class="max-w-md w-full custom-card rounded-2xl shadow-sm p-8 text-center fade-in">
        
        <!-- Loqo/İkon -->
        <div class="mb-6 flex justify-center">
            <div class="w-16 h-16 custom-primary-bg-light rounded-full flex items-center justify-center custom-primary-text">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                </svg>
            </div>
        </div>
        
        <h1 class="text-2xl font-bold tracking-tight mb-3">
            CM Lab
        </h1>
        
        <div class="h-px w-12 custom-primary-bg mx-auto mb-5 opacity-40"></div>
        
        <h2 class="text-lg font-semibold mb-2 opacity-90">
            Sistem yenilənir
        </h2>
        
        <p class="custom-muted-text text-sm leading-relaxed mb-8">
            Tezliklə xidmətinizdəyik.
        </p>

        <!-- Yüklənmə animasiyası -->
        <div class="flex justify-center items-center gap-1.5">
            <div class="w-2 h-2 rounded-full custom-primary-bg opacity-70 animate-bounce" style="animation-delay: 0s"></div>
            <div class="w-2 h-2 rounded-full custom-primary-bg opacity-70 animate-bounce" style="animation-delay: 0.2s"></div>
            <div class="w-2 h-2 rounded-full custom-primary-bg opacity-70 animate-bounce" style="animation-delay: 0.4s"></div>
        </div>
        
    </div>

    <!-- Alt yazı -->
    <div class="mt-8 custom-muted-text text-xs font-medium opacity-70">
        &copy; Chinara Mammadova · 2026
    </div>

</body>
</html>
