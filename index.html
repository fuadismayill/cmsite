<!DOCTYPE html>
<html lang="az" suppressHydrationWarning>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fbf1f3">
    <title>Chinara Mammadova | Tezliklə</title>
    
    <!-- İkonlar (Yeni reponun /public və ya əsas qovluğuna icon.svg yükləsəniz avtomatik işləyəcək) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CM Lab Dark Mode Skripti -->
    <script>
        try {
            var t = localStorage.getItem("psystat_theme");
            var d = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (d) document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', d ? '#1c161a' : '#fbf1f3');
        } catch (e) {}
    </script>

    <style>
        /* CM Lab Şriftləri */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@300;400;500&display=swap');
        
        /* PsyStat ilə eyni rəng tokenləri (açıq rejim) */
        :root {
            color-scheme: light;
            --background: oklch(0.957 0.032 3);
            --foreground: oklch(0.24 0.025 350);
            --card: oklch(1 0 0);
            --card-foreground: oklch(0.24 0.025 350);
            --primary: oklch(0.57 0.16 355);
            --primary-foreground: oklch(0.99 0.006 5);
            --muted-foreground: oklch(0.43 0.04 350);
            --border: oklch(0.88 0.045 4);
            --ring-soft: oklch(0.3 0.1 5 / 10%);
            --shadow-soft: oklch(0.3 0.1 5 / 10%);
        }

        /* Tünd rejim */
        html.dark {
            color-scheme: dark;
            --background: oklch(0.15 0.012 315);
            --foreground: oklch(0.96 0.012 15);
            --card: oklch(0.205 0.016 315);
            --card-foreground: oklch(0.96 0.012 15);
            --primary: oklch(0.79 0.105 3);
            --primary-foreground: oklch(0.23 0.035 350);
            --muted-foreground: oklch(0.72 0.022 15);
            --border: oklch(1 0.01 15 / 9%);
            --ring-soft: oklch(1 0 0 / 10%);
            --shadow-soft: oklch(0 0 0 / 35%);
        }

        html { background-color: var(--background); }
        body {
            font-family: 'Noto Sans', ui-sans-serif, system-ui, sans-serif;
            background-color: var(--background);
            background-image:
                radial-gradient(ellipse at 12% 0%, color-mix(in oklch, var(--primary) 12%, transparent), transparent 55%),
                radial-gradient(ellipse at 90% 100%, color-mix(in oklch, var(--primary) 8%, transparent), transparent 50%);
            background-attachment: fixed;
            color: var(--foreground);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        h1, h2 { font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif; }

        /* Kart: PsyStat-dakı yumşaq halqa + kölgə, yuxarıda zərif gradient */
        .custom-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, color-mix(in oklch, var(--primary) 16%, var(--card)) 0%, var(--card) 45%, var(--card) 100%);
            color: var(--card-foreground);
            border: 0;
            border-radius: 1.5rem;
            box-shadow: 0 18px 50px -20px var(--shadow-soft), 0 0 0 1px var(--ring-soft);
        }

        .custom-primary-text { color: var(--primary); }
        .custom-primary-bg { background-color: var(--primary); }
        .custom-primary-bg-light { background-color: color-mix(in oklch, var(--primary) 15%, transparent); }
        .custom-muted-text { color: var(--muted-foreground); }

        .eyebrow {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .25rem .75rem; border-radius: 999px;
            font-size: .75rem; font-weight: 600; letter-spacing: .02em;
            color: var(--primary);
            background-color: color-mix(in oklch, var(--primary) 12%, transparent);
            box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 25%, transparent);
        }
        .pulse-dot { width: .4rem; height: .4rem; border-radius: 999px; background: var(--primary); animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }

        .fade-in { animation: fadeIn 0.9s ease-out; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) { .fade-in, .pulse-dot, .animate-bounce { animation: none !important; } }
    </style>
</head>
<body class="min-h-dvh flex flex-col items-center justify-center p-4 antialiased transition-colors duration-300">

    <div class="max-w-md w-full custom-card p-8 sm:p-10 text-center fade-in">
        
        <!-- Loqo/İkon -->
        <div class="mb-6 flex justify-center">
            <div class="w-16 h-16 custom-primary-bg-light rounded-2xl flex items-center justify-center custom-primary-text" style="box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 25%, transparent)">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                </svg>
            </div>
        </div>
        
        <div class="mb-4"><span class="eyebrow"><span class="pulse-dot"></span>Tezliklə</span></div>

        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-3">
            Chinara Mammadova
        </h1>
        
        <div class="h-px w-12 custom-primary-bg mx-auto mb-5 opacity-40"></div>
        
        <h2 class="text-lg font-semibold mb-2 opacity-90">
            Sistem yenilənir
        </h2>
        
        <p class="custom-muted-text text-sm leading-relaxed mb-8">
            Tezliklə xidmətinizdəyik.
        </p>

        <!-- Yüklənmə animasiyası -->
        <div class="flex justify-center items-center gap-1.5">
            <div class="w-2 h-2 rounded-full custom-primary-bg opacity-70 animate-bounce" style="animation-delay: 0s"></div>
            <div class="w-2 h-2 rounded-full custom-primary-bg opacity-70 animate-bounce" style="animation-delay: 0.2s"></div>
            <div class="w-2 h-2 rounded-full custom-primary-bg opacity-70 animate-bounce" style="animation-delay: 0.4s"></div>
        </div>
        
    </div>

    <!-- Alt yazı -->
    <div class="mt-8 custom-muted-text text-xs font-medium opacity-70">
        &copy; Chinara Mammadova · 2026
    </div>

</body>
</html>
